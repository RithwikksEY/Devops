name: CI/CD - Staged Kubernetes Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t backend-app:latest ./app

      - name: Save Docker image
        run: docker save backend-app:latest -o backend-app.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-app.tar


  test:
    name: Test Stage (Kubernetes)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image

      - name: Load Docker image
        run: docker load -i backend-app.tar

      - name: Create Kubernetes cluster (Kind)
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: devops
          wait: 120s

      - name: Load image into Kind
        run: kind load docker-image backend-app:latest --name devops


  deploy:
    name: Deploy Stage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/backend-app


  validate:
    name: Validation Stage
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Port forward service
        run: |
          kubectl port-forward svc/backend-service 8080:80 &
          sleep 10

      - name: Validate health endpoint
        run: |
          curl http://localhost:8080/health
