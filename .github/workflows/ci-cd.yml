name: CI/CD - Kubernetes Pipeline

on:
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # ---------- Stage 1: Checkout ----------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------- Stage 2: Build ----------
      - name: Build Docker Image
        run: docker build -t backend-app:latest ./app

      # ---------- Stage 3: Create Kubernetes ----------
      - name: Create Kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: devops
          wait: 120s

      - name: Load Image into Kind
        run: kind load docker-image backend-app:latest --name devops

      # ---------- Stage 4: Deploy ----------
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/backend-app

      # ---------- Stage 5: Validate ----------
      - name: Validate Health Endpoint
        run: |
          kubectl port-forward svc/backend-service 8080:80 &
          sleep 10
          curl http://localhost:8080/health
